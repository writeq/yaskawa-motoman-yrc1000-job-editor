name: Bug report
description: Something in the app doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. If this involves opening/saving a real `.JBI` or condition file, please double-check the report doesn't include sensitive production data before attaching it.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Numbered steps, from launching the app.
      placeholder: |
        1. Open Insert Instruction
        2. Pick ARITH → SET
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: false

  - type: input
    id: os
    attributes:
      label: OS and version
      placeholder: "Windows 11 / macOS 15 / Ubuntu 24.04"
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: App version (or commit SHA if built from source)
    validations:
      required: false

  - type: checkboxes
    id: file-involved
    attributes:
      label: Does this involve a real job/condition file?
      options:
        - label: Yes, and I've confirmed the attached file/excerpt has no sensitive production data
        - label: No
